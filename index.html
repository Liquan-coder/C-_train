<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C++ 闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen app. Stats bar on top, a winding trail of round lesson buttons, tabs at the bottom; lessons open full screen.
     Palette: bright grass green for go/progress, sky blue for "selected", orange for streaks and the mascot's header, gold for cleared lessons. */
  --bg:#FFFFFF; --grid:#FFFFFF; --surface:#FFFFFF; --line:#E3E8E4; --ink:#2F3A33; --muted:#66726A;
  --accent:#3DB54A; --accent-d:#2C8F38; --accent-bg:#E6F7E8;
  --sel:#1E9BE0; --sel-d:#167DB8; --sel-bg:#DFF2FC;
  --stamp:#F08A24; --stamp-d:#C96C10; --stamp-bg:#FFF0DF;
  --gold:#F5B800; --gold-d:#CF9A00; --heart:#E5484D;
  --ok:#279036; --ok-d:#1D6E29; --ok-bg:#DDF5DF;
  --bad:#D93A3F; --bad-bg:#FFE3E3; --warn:#8A5A00; --warn-bg:#FFF1CC;
  --lock:#E3E8E4; --code-bg:#1C2620; --code-ink:#DDE8E0;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"Baloo 2","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191E; --grid:#14191E; --surface:#1C242B; --line:#33404A; --ink:#EEF3F0; --muted:#A6B3AC;
  --accent:#58C766; --accent-d:#3A9A47; --accent-bg:#1D3324;
  --sel:#48B4F0; --sel-d:#2C88BD; --sel-bg:#173246;
  --stamp:#FF9E45; --stamp-d:#C46F1E; --stamp-bg:#3A2A18;
  --gold:#FFC933; --gold-d:#C99A10; --heart:#FF6B6F;
  --ok:#5FD070; --ok-d:#3A9A47; --ok-bg:#17311D;
  --bad:#FF7A7E; --bad-bg:#3A1F22; --warn:#E5B54A; --warn-bg:#3A2E12;
  --lock:#2A343C; --code-bg:#0E1411; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191E; --grid:#14191E; --surface:#1C242B; --line:#33404A; --ink:#EEF3F0; --muted:#A6B3AC;
  --accent:#58C766; --accent-d:#3A9A47; --accent-bg:#1D3324;
  --sel:#48B4F0; --sel-d:#2C88BD; --sel-bg:#173246;
  --stamp:#FF9E45; --stamp-d:#C46F1E; --stamp-bg:#3A2A18;
  --gold:#FFC933; --gold-d:#C99A10; --heart:#FF6B6F;
  --ok:#5FD070; --ok-d:#3A9A47; --ok-bg:#17311D;
  --bad:#FF7A7E; --bad-bg:#3A1F22; --warn:#E5B54A; --warn-bg:#3A2E12;
  --lock:#2A343C; --code-bg:#0E1411; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
svg{display:block}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.92em}
/* JetBrains Mono ligatures draw == != <= -> as single glyphs; students must see the real characters */
code,.formula,.expr,.tile,.tinput,.hint,.codebox{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.codebox{width:100%;min-height:92px;resize:vertical;font-family:var(--mono);font-size:16px;line-height:1.4;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);word-break:break-all}
.codebox:focus{border-color:var(--sel);outline:none}
.codemsg.bad{color:var(--bad)}
b{font-weight:900}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.topic-btn{display:flex;flex-direction:column;align-items:flex-start;min-height:44px;min-width:0;padding:2px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.topic-btn small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);line-height:1.3}
.topic-btn b{font-size:15px;line-height:1.3}
.stats{display:flex;gap:12px;flex:none}
.stat{display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px;color:var(--stamp)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px))}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:0;font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab{font-family:var(--display);font-weight:800}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.03em;background:var(--accent);color:var(--surface);box-shadow:0 4px 0 var(--accent-d)}
.btn:active:not(:disabled),.btn.press:not(:disabled){transform:translateY(4px);box-shadow:none}
.hzb{position:relative}
.hz{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:.011;cursor:pointer;z-index:1}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:none;cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #A82A2E}
.btn.ghost{background:var(--surface);color:var(--sel);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px;font-weight:900}
.muted{color:var(--muted)}
.small{font-size:13px}
.sync{margin-top:6px}.sync.bad{color:var(--bad)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--lock);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

/* trail */
.unit{border-radius:14px;padding:12px 16px;color:var(--surface);background:var(--accent);box-shadow:0 4px 0 var(--accent-d);margin:6px 0 32px}
.unit.must small::after{content:"必考";margin-left:8px;padding:0 7px;border-radius:99px;background:var(--gold);color:var(--ink);font-family:var(--body);font-weight:900;letter-spacing:0}
.unit small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.92}
.unit b{display:block;font-size:17px;font-weight:900;margin-top:1px;text-wrap:balance}
.unit span{display:block;font-size:13px;opacity:.95;margin-top:2px}
.path{display:flex;flex-direction:column;align-items:center;gap:30px;margin-bottom:30px}
.nrow{position:relative;transform:translateX(var(--off));display:flex;flex-direction:column;align-items:center;width:150px}
.node{width:66px;height:62px;border-radius:50%;background:var(--lock);border:0;box-shadow:0 6px 0 var(--line);color:var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;position:relative}
.node.cur{background:var(--accent);color:var(--surface);box-shadow:0 6px 0 var(--accent-d)}
.node.done{background:var(--gold);color:var(--surface);box-shadow:0 6px 0 var(--gold-d)}
.node.exam{border-radius:18px}
.node svg{width:26px;height:26px}
.bubble{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--accent);border:2px solid var(--line);font-weight:900;font-size:12px;padding:1px 9px;border-radius:10px}
.nlabel{text-align:center;font-size:13px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.3;text-wrap:balance}
.nscore{font-family:var(--display);font-weight:800;font-size:13px;color:var(--gold-d)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.spanel{position:absolute;left:0;right:0;bottom:0;max-width:600px;max-height:85%;overflow-y:auto;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.spanel h2{margin:0;font-size:18px;font-weight:900;text-wrap:balance}
.sacts{display:flex;flex-direction:column;gap:10px}
.topic-opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.topic-opt.on{border:2px solid var(--sel);background:var(--sel-bg)}

/* lesson */
#lesson{position:fixed;inset:0;z-index:40;display:none;background:var(--bg)}
#lesson.on{display:block}
.lwrap{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border-inline:1px solid var(--line)}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.x{background:none;border:0;color:var(--muted);width:44px;height:44px;display:grid;place-items:center;flex:none;margin:-6px}
.x svg{width:22px;height:22px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--lock);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.hearts{display:flex;align-items:center;gap:3px;color:var(--heart);font-family:var(--display);font-weight:800;font-size:17px;flex:none}
.hearts svg{width:22px;height:22px}
.combo{font-weight:900;color:var(--stamp);font-size:13px;min-height:20px;padding:0 16px}
.lbody{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px}
.prompt{font-size:17px;font-weight:900;margin:0;line-height:1.45}
.prompt.en{font-size:15px;font-weight:700}
.stem{border-left:4px solid var(--accent);background:var(--stamp-bg);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5}
.stem summary{font-weight:900;font-size:12px;color:var(--muted);cursor:pointer;min-height:28px;display:flex;align-items:center}
.stem .sbody{max-height:34vh;overflow:auto;margin-top:4px}
.tag{align-self:flex-start;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.flag{display:inline-block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:0 7px;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:52px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-size:14px;font-weight:700}
.opt .k{flex:none;min-width:26px;height:26px;padding:0 4px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-family:var(--mono)}
.opt.sel{border-color:var(--sel);box-shadow:0 3px 0 var(--sel);background:var(--sel-bg);color:var(--sel)}
.opt.ok{border-color:var(--ok);box-shadow:0 3px 0 var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-bg);color:var(--bad)}
.intro{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.intro h3{margin:0;font-size:16px;font-weight:900}
.formula{display:block;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px;overflow-x:auto;white-space:pre-wrap;margin:2px 0}
.expr{display:block;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}
.tw{overflow-x:auto;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--accent-bg)}
.ansline{min-height:56px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding-bottom:8px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:44px;min-height:46px;padding:0 12px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-family:var(--mono);font-weight:700;font-size:14px}
.tile.used{color:transparent;background:var(--lock);box-shadow:none;border-color:var(--lock)}
.tinput{width:100%;min-height:50px;font-family:var(--mono);font-weight:700;font-size:16px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.tinput:focus{border-color:var(--sel);outline:none}
.hint{font-family:var(--mono);font-size:14px;letter-spacing:2px;color:var(--muted);word-break:break-word}
.linkbtn{align-self:flex-start;min-height:44px;background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:13px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{min-height:56px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-weight:700;font-size:13px;line-height:1.3;word-break:break-word}
.mt.sel{border-color:var(--sel);box-shadow:0 3px 0 var(--sel);background:var(--sel-bg);color:var(--sel)}
.mt.gone{opacity:.35;box-shadow:none;background:var(--ok-bg);border-color:var(--ok)}
.mt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* guide */
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--stamp-bg);font-weight:700;font-size:14px;line-height:1.5}
.goal svg{width:22px;height:22px;color:var(--stamp);flex:none;margin-top:2px}
.gnotes{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:0 10px 10px 0}
.gnotes:empty{display:none}
.gn{display:flex;gap:6px;align-items:flex-start;font-size:13px;font-weight:700;color:var(--ok)}
.gn svg{width:16px;height:16px;flex:none;margin-top:3px}
.gstep{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.gfb{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:6px;animation:rise .24s ease-out}
.gfb.ok{background:var(--ok-bg)}.gfb.bad{background:var(--bad-bg)}
.gfb .t{font-size:15px;font-weight:900}.gfb.ok .t{color:var(--ok)}.gfb.bad .t{color:var(--bad)}
/* ask AI */
.askai{display:none;align-self:flex-start;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--sel);background:var(--surface);color:var(--sel);font-weight:800;font-size:13px}
html.ai .askai{display:inline-flex}
.askai svg{width:17px;height:17px}
#chat{position:fixed;inset:0;z-index:60;display:none}
#chat.on{display:block}
.cpanel{position:absolute;left:0;right:0;bottom:0;max-width:600px;height:88%;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:rise .2s ease-out}
.chead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.chead b{font-size:17px;font-weight:900}
.cctx{margin:0 16px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.cctx summary{cursor:pointer;font-weight:700;color:var(--muted);min-height:28px}
.cctx div{white-space:pre-wrap;max-height:28vh;overflow:auto;margin-top:6px;color:var(--muted)}
.cmsgs{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.cmsg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.65;word-break:break-word}
.cmsg.u{align-self:flex-end;background:var(--sel);color:#fff;border-bottom-right-radius:4px}
.cmsg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.cmsg.a code{background:var(--code-bg);color:var(--code-ink);padding:1px 5px;border-radius:5px}
.cmsg.err{color:var(--bad);border-color:var(--bad)}
.cquick{display:flex;gap:6px;overflow-x:auto;padding:0 16px 6px}
.cquick button{flex:none;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700}
.cform{display:flex;gap:8px;padding:6px 16px 6px;align-items:flex-end}
.cform textarea{flex:1;min-width:0;min-height:44px;max-height:120px;resize:none;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.cform textarea:focus{border-color:var(--sel);outline:none}
.cform .btn{min-height:44px;padding:0 16px;font-size:15px;flex:none}
.cnote{padding:0 16px 8px}
@media (min-width:900px){.cmsg{font-size:15.5px}}
/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:14px;align-items:center}
.chip{min-height:44px;padding:4px 12px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-weight:700;font-size:14px;text-align:left;line-height:1.35}
.chip.sel{border-color:var(--sel);box-shadow:0 3px 0 var(--sel);background:var(--sel-bg);color:var(--sel)}
.chip.ok{border-color:var(--ok);box-shadow:0 3px 0 var(--ok);background:var(--ok-bg);color:var(--ok)}
.chip.bad{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-bg);color:var(--bad)}
.bks{display:flex;flex-direction:column;gap:8px}
.bk{border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--bg);transition:border-color .15s}
.bk.ready{border-color:var(--sel)}
.bkh{min-height:44px;border:0;border-radius:10px;background:var(--accent-bg);color:var(--ink);font-weight:900;font-size:14px;text-align:left;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bkp{font-size:12px;font-weight:700;color:var(--muted);opacity:0;transition:opacity .15s}
.bk.ready .bkh{background:var(--sel-bg);color:var(--sel)}
.bk.ready .bkp{opacity:1;color:var(--sel)}
.bkc{display:flex;flex-wrap:wrap;gap:6px}
.bkc:empty{display:none}
/* drag */
.drl{display:flex;flex-direction:column;gap:8px}
.dr{display:flex;align-items:center;gap:6px;min-height:52px;padding:4px 4px 4px 8px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-weight:700;font-size:14px;line-height:1.35;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .15s}
.dr.lift{transition:none;position:relative;z-index:2;border-color:var(--sel);box-shadow:0 10px 20px rgba(0,0,0,.2);background:var(--sel-bg);color:var(--sel);cursor:grabbing}

<script>
/* ---------- Past-paper data, generated from the study hub's exam page ---------- */
const EXAMS={};
const TOPIC_BUILDERS=[];

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[\s\-_]+/g,"").replace(/\.$/,"");
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

/* Step builders. Every step: k = card | choice | fill | order | match | flash | sort | drag | range | guide */
const K=(title,html)=>({k:"card",title,html});
const C=(q,o,a,why,x)=>({k:"choice",q,o,a,why,...x});
const F=(q,ans,show,why,x)=>({k:"fill",q,ans,show,why,...x});
const O=(q,seq,why,x)=>({k:"order",q,seq,why,...x});
const M=(q,pairs)=>({k:"match",q,pairs});
const Fl=(q,a,x)=>({k:"flash",q,a,...x});
const G=fn=>({gen:fn});
/* B: tap a card, then tap a bucket. items = [[text, bucket index], ...] */
const B=(q,cats,items,why,x)=>({k:"sort",q,cats,items,why,...x});
/* D: drag rows (or use the arrows) into the right order. seq = correct order; shown shuffled */
const D=(q,seq,why,x)=>({k:"drag",q,seq,why,...x});
/* Sl: slider. cfg = {min,max,step,init,unit,label,view:v=>html (live), ok:v=>bool, show:"answer text"}; init must be wrong */
const Sl=(q,cfg,why,x)=>({k:"range",q,...cfg,why,...x});
/* Gd: guided lesson inside one step. goal = what you'll understand; steps = [{q, o, a, miss:[why each option is wrong, "" for the answer], why, note}];
   wrap = the rule you just derived. Wrong picks explain themselves and you pick again; no hearts lost. */
const Gd=(goal,steps,wrap)=>({k:"guide",q:goal,goal,steps,wrap});

/* Flow diagram used in feedback: one client/server pair per connection, each round trip a V */
function flow(cols){
  const left=22,cw=150,sh=34,top=24,total=Math.max(...cols.map(c=>(c.start||0)+c.seq.length));
  const W=Math.max(left+cols.length*cw,240),H=top+total*sh+4;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="流程圖，總共 ${total} RTT">`;
  for(let t=0;t<total;t++)s+=`<text x="2" y="${top+t*sh+sh/2+4}" font-size="12" font-weight="700">${t+1}</text>`;
  cols.forEach((c,i)=>{const x=left+i*cw,cx=x+10,sx=x+cw-16,st=c.start||0,y0=top+st*sh,y1=y0+c.seq.length*sh;
    s+=`<text x="${cx}" y="13" font-size="12" text-anchor="middle">C</text><text x="${sx}" y="13" font-size="12" text-anchor="middle">${c.s}</text>`;
    s+=`<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${y1}" stroke="currentColor"/><line x1="${sx}" y1="${y0}" x2="${sx}" y2="${y1}" stroke="currentColor"/>`;
    c.seq.forEach((lb,t)=>{const y=y0+t*sh,col=lb==="TCP"?"var(--muted)":lb==="HTML"?"var(--accent)":"var(--ok)";
      s+=`<line x1="${cx}" y1="${y+3}" x2="${sx-2}" y2="${y+sh/2-2}" stroke="${col}" stroke-width="1.6" marker-end="url(#ah)"/><line x1="${sx}" y1="${y+sh/2}" x2="${cx+2}" y2="${y+sh-3}" stroke="${col}" stroke-width="1.6" marker-end="url(#ah)"/><text x="${sx-5}" y="${y+sh-3}" font-size="12" text-anchor="end">${lb}</text>`})});
  return `<div class="flowbox">${s}</svg></div>`;
}
const examChoice=(it,tag)=>({k:"choice",q:it.q,o:it.o,a:it.a,why:it.w,keep:true,en:true,flag:!!it.flag,tag:tag||it.y});
const examFill=(it,tag)=>({k:"fill",q:it.q,ans:it.a,show:it.s,why:it.w,en:true,tag:tag||it.y});
const examFlash=(it,tag)=>({k:"flash",q:it.q,a:it.a,en:true,tag:tag||it.y});

/* ---- topics/cpp.js ---- */
/* Topic: C++ 基礎 — 變數、for 迴圈、函式入門，接著講義 05 函式、07 指標與動態陣列、10 排序、11 結構與類別。 */
TOPIC_BUILDERS.push((()=>{
/* ---------- code helpers: P = code block, c = inline code (both escape < > &) ---------- */
const dd=s=>{const L=String(s).replace(/^\n+/,"").replace(/\s+$/,"").split("\n");const m=Math.min(...L.filter(l=>l.trim()).map(l=>l.match(/^ */)[0].length));return L.map(l=>l.slice(m)).join("\n")};
const P=s=>`<code class="formula">${esc(dd(s))}</code>`;
const c=s=>`<code>${esc(s)}</code>`;
const T=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`;
const rnd=(a,b)=>a+(Math.random()*(b-a+1)|0);

/* ---------- 變數與運算 ---------- */
const gDiv=()=>{const op=pick(["/","%","/2.0"]);
  if(op==="/2.0"){const b=pick([2,4,5]),a=b*rnd(1,4)+rnd(1,b-1),v=a/b;
    return F(`${P(`int a = ${a};\ncout << a / ${b}.0;`)}印出什麼？`,[String(v)],String(v),`有一邊是小數（${b}.0），就做小數除法：<code>${a} ÷ ${b} = ${v}</code>`,{num:true})}
  const b=pick([2,3,4,5]),q=rnd(1,4),r=rnd(1,b-1),a=b*q+r,v=op==="/"?q:r;
  return F(`${P(`int a = ${a}, b = ${b};\ncout << a ${op} b;`)}印出什麼？`,[String(v)],String(v),
    op==="/"?`int ÷ int，小數直接砍掉：${a} ÷ ${b} = ${(a/b).toFixed(2)}… → <b>${v}</b>`:`% 是餘數：<code>${a} = ${b} × ${q} + ${r}</code>，餘 <b>${r}</b>`,{num:true})};
const gOps=()=>{let x=rnd(3,9);const start=x,ops=[],lines=[];
  for(let n=0;n<3;n++){const t=pick(["+=","-=","*=","++","--"]),k=rnd(2,4);
    if(t==="+="){x+=k;lines.push(`x += ${k};`);ops.push(`+${k} → ${x}`)}
    else if(t==="-="){x-=k;lines.push(`x -= ${k};`);ops.push(`−${k} → ${x}`)}
    else if(t==="*="){x*=k;lines.push(`x *= ${k};`);ops.push(`×${k} → ${x}`)}
    else if(t==="++"){x++;lines.push(`x++;`);ops.push(`+1 → ${x}`)}
    else{x--;lines.push(`x--;`);ops.push(`−1 → ${x}`)}}
  return F(`${P(`int x = ${start};\n${lines.join("\n")}\ncout << x;`)}印出什麼？`,[String(x)],String(x),`一行一行算：${start} ${ops.join("，")}`,{num:true})};

/* ---------- for 迴圈 ---------- */
const head=(s,op,e,k,decl=true)=>`for (${decl?"int ":""}i = ${s}; i ${op} ${e}; ${k===1?"i++":"i += "+k})`;
const vals=(s,op,e,k)=>{const v=[];for(let i=s;op==="<"?i<e:i<=e;i+=k)v.push(i);return v};
const rLoop=()=>{const s=pick([0,1,2,3]),k=pick([1,1,2,3]),op=pick(["<","<="]),e=s+rnd(4,10);return{s,k,op,e,v:vals(s,op,e,k)}};
const gCount=()=>{const p=rLoop(),n=p.v.length;
  return F(`${P(`${head(p.s,p.op,p.e,p.k)}\n    cout << i << " ";`)}大括號（這裡只有一行）會跑幾次？`,[String(n)],n+" 次",`i 依序是 ${p.v.join("、")}，下一個 ${p.s+p.k*n} 讓 <code>i ${esc(p.op)} ${p.e}</code> 不成立，所以 <b>${n}</b> 次。`,{num:true})};
const gSum=()=>{const p=rLoop(),sum=p.v.reduce((a,b)=>a+b,0);
  return F(`${P(`int sum = 0;\n${head(p.s,p.op,p.e,p.k)}\n    sum += i;\ncout << sum;`)}印出什麼？`,[String(sum)],String(sum),`i 依序是 ${p.v.join("、")}：<code>${p.v.join(" + ")} = ${sum}</code>`,{num:true})};
const gLast=()=>{const p=rLoop(),n=p.v.length,last=p.s+p.k*n;
  return F(`${P(`int i, count = 0;\n${head(p.s,p.op,p.e,p.k,false)}\n    count++;\ncout << i;`)}迴圈結束後印出的 i 是多少？`,[String(last)],String(last),`i 跑過 ${p.v.join("、")}，再更新一次變成 <b>${last}</b>，這時 <code>${last} ${esc(p.op)} ${p.e}</code> 不成立才離開。i 宣告在迴圈外面，所以離開後還看得到它。`,{num:true})};
const gNested=()=>{const n=rnd(2,5),m=rnd(2,5),t=pick(["fix","fix","lt","le"]);
  const inner=t==="fix"?`j < ${m}`:t==="lt"?"j < i":"j <= i";
  const per=t==="fix"?Array(n).fill(m):Array.from({length:n},(_,i)=>t==="lt"?i:i+1),tot=per.reduce((a,b)=>a+b,0);
  return F(`${P(`int count = 0;\nfor (int i = 0; i < ${n}; i++)\n    for (int j = 0; ${inner}; j++)\n        count++;\ncout << count;`)}印出什麼？`,[String(tot)],String(tot),

/* Topics live in topics/*.js; each pushes a builder returning {id,name,desc,note,units:[{title,sub,must?,nodes:[{title,exam?,steps}]}],terms}. */
const TOPICS=TOPIC_BUILDERS.map(b=>b());
const NODE_INDEX={};
TOPICS.forEach(t=>{let n=0;t.units.forEach(u=>u.nodes.forEach(nd=>{nd.id=t.id+"/"+nd.title;nd.num=++n;nd.topic=t.id;nd.steps.forEach((s,i)=>{s.id=nd.id+"#"+(s.q||s.title||("g"+i));NODE_INDEX[s.id]=s})}));t.allNodes=t.units.flatMap(u=>u.nodes)});

/* ---------- State ---------- */
const KEY="cpp-quest-v1";
const fresh=()=>({topic:"cpp",xp:0,streak:0,last:null,day:null,dayXp:0,sound:true,vol:2,haptic:true,t:{}});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
/* S.ts = time of the last change. It never goes backwards, so a device whose clock runs slow still writes a newer ts than the one it read. */
function save(){S.ts=Math.max(Date.now(),(S.ts||0)+1);saveLocal();cloudQueue()}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!TOPICS.find(t=>t.id===S.topic))S.topic=TOPICS[0].id;

/* ---------- Cloud save (db capability, the viewer's private data/users/<id>/ subtree) ----------
   localStorage alone gets wiped in the phone app and never reaches another device, so progress also lives in one db doc.
   The doc holds S as a JSON string (step ids contain "/" and "#"). Newer ts wins; the first sync of a visit merges instead,
   so progress made on this device before (or without) the cloud is never thrown away. Topic and sound/volume/haptics stay per device. */
const DEVICE_PREFS=["topic","sound","vol","haptic"];
const CLOUD={st:"local",msg:"",ref:null,ready:false,busy:false,again:false,timer:null};
const SYNC_TXT={local:"只存在這台裝置",loading:"正在連線雲端…",ok:"已同步到雲端，換裝置也接得上",slow:"暫時連不上雲端，進度先存在這台裝置",err:"雲端存檔失敗，進度先存在這台裝置",off:"沒有登入 Claude，進度只存在這台裝置",code:"這個帳號不能雲端存檔，進度存在這台裝置；換裝置請用存檔碼"};
const syncText=()=>"存檔："+SYNC_TXT[CLOUD.st]+(CLOUD.msg?"（"+CLOUD.msg+"）":"");
function setSync(st,msg){CLOUD.st=st;CLOUD.msg=msg||"";const el=$("#syncLine");if(el){el.textContent=syncText();el.classList.toggle("bad",st==="err"||st==="slow")}}
const hasProgress=s=>(s.xp||0)>0||Object.values(s.t||{}).some(x=>Object.keys(x.done||{}).length||Object.keys(x.wrong||{}).length);
function cloudCopy(){const o={...S};DEVICE_PREFS.forEach(k=>delete o[k]);return o}
function adopt(c){const keep={};DEVICE_PREFS.forEach(k=>keep[k]=S[k]);S=Object.assign(fresh(),c,keep);saveLocal();render()}
/* c = cloud, l = this device. Lessons: best score of either; wrong lists: union; streak/day: whichever is later. */
function mergeState(c,l){const m=Object.assign(fresh(),c,{ts:Math.max(c.ts||0,l.ts||0),xp:Math.max(c.xp||0,l.xp||0),t:{}});
  DEVICE_PREFS.forEach(k=>m[k]=l[k]);
  const dn=s=>s?+new Date(String(s).replace(/-/g,"/")):0;
  if(dn(l.last)>dn(c.last)||(l.last===c.last&&(l.streak||0)>(c.streak||0))){m.last=l.last;m.streak=l.streak}
  if(dn(l.day)>dn(c.day)||(l.day===c.day&&(l.dayXp||0)>(c.dayXp||0))){m.day=l.day;m.dayXp=l.dayXp}
  new Set([...Object.keys(c.t||{}),...Object.keys(l.t||{})]).forEach(id=>{const a=(c.t||{})[id]||{},b=(l.t||{})[id]||{},done={...a.done};
    Object.entries(b.done||{}).forEach(([k,v])=>done[k]=Math.max(done[k]||0,v));m.t[id]={done,wrong:{...a.wrong,...b.wrong}}});
  return m}
async function cloudInit(){
  if(!window.claude||!claude.use)return;              // local test page: stays "local"
  setSync("loading");
  let db=null,user=null;
  try{[db,user]=await Promise.all([claude.use("db"),claude.use("user")])}catch(e){}
  const uid=user?await user.id():null;
  if(!db){setSync("local");return}
  if(!uid){setSync("off");return}
  try{if(user&&(await user.can("data.write"))===false){setSync("code");return}}catch(e){}   // e.g. students opening a shared link
  CLOUD.ref=db.doc("data/users/"+uid+"/quest-progress");
  const base=S.ts||0;                                  // what this device had when the page opened
  const slow=setTimeout(()=>{if(!CLOUD.ready)setSync("slow")},10000);
  CLOUD.ref.onSnapshot(snap=>{
    if(!CLOUD.ready&&snap.metadata.fromCache)return;   // decide the first sync on confirmed data only
    let c=null;try{if(snap.exists){const d=snap.data();if(typeof d.s==="string")c=JSON.parse(d.s)}}catch(e){}
    if(!CLOUD.ready){CLOUD.ready=true;clearTimeout(slow);setSync("ok");
      if(!c){if(hasProgress(S))save();return}          // save() stamps a ts, so other devices see it as newer than nothing
      const playedHere=(S.ts||0)>base||(!base&&hasProgress(S));   // changes since open, or progress saved before cloud existed
      if((c.ts||0)>base||!base){if(playedHere){S=mergeState(c,S);render();save()}else adopt(c)}
      else if((S.ts||0)>(c.ts||0))cloudPush();
      return}
    if(c&&(c.ts||0)>(S.ts||0))adopt(c);                // another device saved: take it (our own echo has the same ts)
  },e=>{clearTimeout(slow);setSync("err",e&&e.code);if(!CLOUD.ready)CLOUD.ref=null});
}
function cloudQueue(){if(!CLOUD.ref||!CLOUD.ready)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,800)}
async function cloudPush(retry){clearTimeout(CLOUD.timer);CLOUD.timer=null;
  if(!CLOUD.ref||!CLOUD.ready)return;
  if(CLOUD.busy){CLOUD.again=true;return}             // one write at a time; the next one sends the latest S
  const s=JSON.stringify(cloudCopy());
  if(s.length>240000){setSync("err","進度資料太大");return}
  CLOUD.busy=true;CLOUD.again=false;
  try{await CLOUD.ref.set({v:1,ts:S.ts||0,s});setSync("ok")}
  catch(e){const code=e&&e.code;
    if(code==="unavailable"&&!retry){CLOUD.busy=false;setTimeout(()=>cloudPush(true),1000+Math.random()*2000);return}
    setSync("err",code);
    if(["revoked","not_granted","capability_disabled","capability_removed","invalid_argument","transform_error"].includes(code))CLOUD.ref=null}
  CLOUD.busy=false;if(CLOUD.again)cloudPush()}
/* closing the app or switching away: send a pending save right now instead of waiting for the timer */
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&CLOUD.timer)cloudPush()});
addEventListener("pagehide",()=>{if(CLOUD.timer)cloudPush()});

/* ---------- Save code: the whole progress as one line of text (no login needed) ----------
   Students on a shared link cannot use the cloud save, and the phone app can wipe localStorage, so they copy this code
   somewhere safe and paste it back on any device. Format "CPP1-" + base64url of:
   ver(1) xp(4) streak(2) last(2) day(2) dayXp(2) nDone(2) [lessonHash(3) score(1)]* nWrong(2) [stepHash(3)]* checksum(1)
   Lessons and steps are stored as 24-bit hashes of their ids, so adding new lessons later does not break old codes
   (a renamed lesson loses its record, same as everywhere else). Loading a code merges with this device, never overwrites. */
const CODE_PREFIX="CPP1-";
const h24=s=>{let h=0x811c9dc5;for(const ch of String(s)){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}return (h^(h>>>24))&0xffffff};
const D0=Date.UTC(2020,0,1);
const dnum=s=>{if(!s)return 0;const p=String(s).split("-").map(Number);if(!p[0])return 0;const n=Math.round((Date.UTC(p[0],p[1]-1,p[2])-D0)/864e5);return n>0&&n<65536?n:0};
const dback=n=>{if(!n)return null;const d=new Date(D0+n*864e5);return d.getUTCFullYear()+"-"+(d.getUTCMonth()+1)+"-"+d.getUTCDate()};
function makeCode(){const b=[1],u=(v,n)=>{v=Math.max(0,Math.floor(+v||0));for(let i=n-1;i>=0;i--)b.push(Math.floor(v/2**(8*i))%256)};
  u(Math.min(S.xp||0,4294967295),4);u(Math.min(S.streak||0,65535),2);u(dnum(S.last),2);u(dnum(S.day),2);u(Math.min(S.dayXp||0,65535),2);
  const done=[],wrong=[];

/* ---------- Lesson engine ---------- */
let L=null;

/* ---- guide: small "what do you need / why" questions that build one idea ---- */

  if(ok&&!s.retry&&!L.exam){const h=document.querySelector(".lhead");if(h){const f=document.createElement("span");f.className="xpf";f.textContent="+2 XP";h.appendChild(f);setTimeout(()=>f.remove(),950)}}
  const c=$("#combo");if(c){const big=[5,10,15,20,30].includes(L.combo);
    c.innerHTML=L.combo>=3?`<span class="cb${big?" big":""}">${IC.flame}${big?"連對 "+L.combo+" 題！":L.combo+" 連對"}</span>`:"";if(big){sfx.combo();buzz([15,30,15])}}
  foot.scrollTop=0;go.focus({preventScroll:true});
}
function onGo(){const s=L.step;
  if(L.state==="cont")return next();
  if(s.k==="card")return next();
  if(s.k==="choice"){if(L.sel==null)return;const ok=L.sel===s.a;document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.classList.remove("sel");if(i===s.a)b.classList.add("ok");else if(i===L.sel)b.classList.add("bad");b.disabled=true});
    return grade(ok,(ok?"":`答案：<span class="ans">${s.o[s.a]}</span><br>`)+s.why)}
  if(s.k==="fill"){const v=$("#ti").value.trim();if(!v)return;$("#ti").disabled=true;
    const nv=norm(v),hit=s.ans.some(a=>norm(a)===nv),abbr=(s.abbr||[]).some(a=>norm(a)===nv);
    const near=!hit&&!s.num&&!abbr&&s.ans.some(a=>norm(a).length>=6&&lev(norm(a),nv)===1);
    if(abbr)return grade(false,`這是縮寫，考試不給分。全名：<span class="ans">${esc(s.show)}</span>`);
    if(near)return grade(true,`拼字差一點，正確是 <span class="ans">${esc(s.show)}</span>。${s.why}`);
    return grade(hit,(hit?"":`答案：<span class="ans">${esc(s.show)}</span><br>`)+s.why)}
  if(s.k==="order"){const got=L.picked.map(i=>s.bank[i]),ok=got.length===s.seq.length&&got.every((t,i)=>t===s.seq[i]);
    return grade(ok,(ok?"":`正確順序：<span class="ans">${s.seq.map(esc).join(" → ")}</span><br>`)+s.why)}
  if(s.k==="guide")return guideGo();
  if(s.k==="sort"){if(L.at.some(b=>b<0))return;const ok=L.at.every((b,i)=>b===s.items[i][1]);
    grade(ok,(ok?"":`正確分法：<br>${s.cats.map((c,b)=>`<b>${c}</b>：${s.items.filter(x=>x[1]===b).map(x=>x[0]).join("、")}`).join("<br>")}<br>`)+s.why);drawSort();return}
  if(s.k==="drag"){const ok=L.ord.every((v,i)=>v===i);grade(ok,(ok?"":`正確順序：<span class="ans">${s.seq.join(" → ")}</span><br>`)+s.why);drawDrag();return}
  if(s.k==="range"){if(L.val==null)return;const ok=!!s.ok(L.val);["#rg","#rm","#rp"].forEach(x=>$(x).disabled=true);
    return grade(ok,(ok?"":`答案：<span class="ans">${s.show}</span><br>`)+s.why)}
  if(s.k==="flash"){if(!L.revealed){L.revealed=true;$("#fa").innerHTML=`<div class="ansbox">${s.a}</div>${askBtn()}`;const f=$("#foot");f.innerHTML=`<div class="row"><button class="btn bad" id="no" style="flex:1">還不會</button><button class="btn ok" id="yes" style="flex:1">我會了</button></div>`;
      const self=ok=>{L.state="cont";record(ok);buzz(ok?12:[30,40]);if(!s.retry){if(ok)L.right++;else L.wrong++}sfx[ok?"ok":"bad"]();next()};$("#no").onclick=()=>self(false);$("#yes").onclick=()=>self(true);$("#fa").scrollIntoView({behavior:"smooth",block:"start"})}return}
}
function failed(){L.state="end";$("#lesson").innerHTML=`<div class="lwrap"><div class="result">${mascot("bad",96)}<h1>愛心用完了</h1><p class="muted" style="margin:0">答錯的題目已經收進錯題本，再來一次會更順。</p><div class="stack" style="width:100%"><button class="btn wide" id="again">再挑戰一次</button><button class="btn ghost wide" id="leave">回路徑</button></div></div></div>`;
  $("#again").onclick=()=>startLesson(L.node);$("#leave").onclick=quit}
function finish(){const n=L.node,tot=L.right+L.wrong,acc=tot?Math.round(L.right/tot*100):100,gain=5+L.right*2,perfect=tot>0&&L.wrong===0;
  S.xp+=gain;if(S.day!==today()){S.day=today();S.dayXp=0}S.dayXp+=gain;
  const newDay=S.last!==today();if(newDay){S.streak=S.last===yesterday()?S.streak+1:1;S.last=today()}
  if(n.id){const st=tState(n.topic);st.done[n.id]=Math.max(st.done[n.id]||0,acc||1)}
  save();sfx.win();buzz([20,40,20,40,60]);
  const mins=Math.max(1,Math.round((Date.now()-L.t0)/60000));
  const nx=n.id?nextNode():null;const goal=todayXp()>=GOAL&&todayXp()-gain<GOAL;
  $("#lesson").innerHTML=`<div class="lwrap"><div class="result" id="res"><div class="rhero">${mascot("win",84)}<div class="rstamp">${perfect?"全對":"過關"}</div></div><h1>${perfect?"全部答對！":esc(n.title)+" 過關"}</h1>${newDay?`<div class="cb big">${IC.flame}連續 ${curStreak()} 天</div>`:""}${goal?`<div class="cb big">今日目標 ${GOAL} XP 達成</div>`:""}<div class="rt"><div class="rtile"><small>XP</small><b id="rx">+0</b></div><div class="rtile"><small>正確率</small><b id="ra">0%</b></div><div class="rtile"><small>時間</small><b>${mins} 分</b></div></div><div class="stack" style="width:100%">${nx?`<button class="btn wide" id="nextN">下一關：${esc(nx.title)}</button>`:""}<button class="btn ghost wide" id="leave">回路徑</button></div></div></div>`;
  countUp($("#rx"),gain,"","+");countUp($("#ra"),acc,"%");confetti($("#res"));
  if(nx)$("#nextN").onclick=()=>startLesson(nx);$("#leave").onclick=quit;
}
/* ---------- Ask AI: a chat about the question you just did (sample capability, viewer's own Claude usage) ---------- */
let AI=null;const CHATS=new Map();
try{window.claude&&claude.use("sample").then(f=>{AI=f;document.documentElement.classList.toggle("ai",!!f)}).catch(()=>{})}catch(e){}
const askBtn=(label)=>`<button class="askai" data-ask="1">${IC.chat}<span>${label||"不懂為什麼？問 AI"}</span></button>`;
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-ask]");if(b&&L)openChat()});
const txt=h=>{const d=document.createElement("div");d.innerHTML=String(h??"");d.querySelectorAll("br").forEach(x=>x.replaceWith("\n"));return d.textContent.replace(/[ \t]+\n/g,"\n").trim()};
function ctxOf(){const s=L.step,out=[`科目：${topic().name}；關卡：${L.node&&L.node.title||""}`],done=L.state==="cont";
  if(s.k==="card"){out.push(`教學卡「${txt(s.title)}」：`,txt(s.html));return out.join("\n")}
  if(s.k==="guide"){const g=s.steps[L.gi];out.push(`引導題的目標：${txt(s.goal)}`);s.steps.slice(0,L.gi).forEach((x,i)=>out.push(`已完成第 ${i+1} 步：${txt(x.q)} → ${txt(x.o[x.a])}`));
    out.push(`目前第 ${L.gi+1} 步：${txt(g.q)}`,`選項：${g.o.map(txt).join("／")}`,`正確答案：${txt(g.o[g.a])}`);
    if(L.gwrong.length)out.push(`學生選錯過：${L.gwrong.map(i=>txt(g.o[i])+"（"+txt(g.miss[i])+"）").join("、")}`);if(g.why)out.push(`解析：${txt(g.why)}`);return out.join("\n")}
  if(s.ctx)out.push(`題目設定：${txt(s.ctx)}`);
  out.push(`${s.ctx?"這一小題":"題目"}：${txt(s.q)}`);
  if(s.k==="choice"){out.push(`選項：${s.o.map(txt).join("／")}`,`正確答案：${txt(s.o[s.a])}`);if(L.sel!=null)out.push(`學生選了：${txt(s.o[L.sel])}`)}
  if(s.k==="fill"){out.push(`正確答案：${txt(s.show)}`);const v=($("#ti")||{}).value||L.typed;if(v)out.push(`學生寫了：${v}`)}
  if(s.k==="order"){out.push(`正確順序：${s.seq.map(txt).join(" → ")}`);if(L.picked&&L.picked.length)out.push(`學生排成：${L.picked.map(i=>txt(s.bank[i])).join(" → ")}`)}
  if(s.k==="match")out.push(`正確配對：${s.pairs.map(p=>txt(p[0])+" = "+txt(p[1])).join("；")}`);
  if(s.k==="sort"){const by=f=>s.cats.map((c,b)=>txt(c)+"："+s.items.filter((x,i)=>f(x,i)===b).map(x=>txt(x[0])).join("、")).join("；");out.push(`正確分類：${by(x=>x[1])}`);if(L.at)out.push(`學生分成：${by((x,i)=>L.at[i])}`)}
  if(s.k==="drag"){out.push(`正確順序：${s.seq.map(txt).join(" → ")}`);if(L.ord)out.push(`學生排成：${L.ord.map(i=>txt(s.seq[i])).join(" → ")}`)}
  if(s.k==="range"){out.push(`正確答案：${txt(s.show)}`);if(L.val!=null)out.push(`學生選了：${L.val} ${s.unit||""}`)}
  if(s.k==="flash")out.push(`參考答案：${txt(s.a)}`);
  if(done&&s.k!=="flash"&&s.k!=="guide")out.push(`結果：學生這題${L.lastOk?"答對了":"答錯了"}`);
  if(s.why)out.push(`解析：${txt(s.why)}`);if(s.flag)out.push("注意：這題答案是推論，有爭議空間。");
  return out.join("\n")}
const RULES=`你是一位很有耐心的家教，學生是 C++ 初學者，正在用闖關題目練習。
回答規則：
- 用繁體中文（台灣用語），專有名詞保留英文。
- 程式碼用 C++，例子要短（5 行以內），並說明每一行在做什麼。
- 第一句就直接回答學生的問題，不要客套。
- 先給一個很小的具體例子或生活比喻，再講原理。出現新術語就順便用一句白話解釋。
- 學生答錯時，指出他的想法是哪一步走偏，不要只重複正確答案。
- 簡短：大約 3 到 8 句，或幾個條列。不要用表格，不要用 LaTeX，算式用純文字，例如 (1 + 6) × 2 = 14。
- 可以用 **粗體** 標重點、用「- 」開頭條列、用 \`反引號\` 包算式。
- 以下面的題目和解析為準；如果題目標示有爭議，要老實說。
學生剛剛做的題目：
`;
const md=t=>esc(t).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/^\s*[-*] /gm,"• ").replace(/\n/g,"<br>");
const AI_ERR={not_granted:"這個頁面沒有被允許使用 Claude。",sampling_disabled:"這個帳號目前不能使用 Claude。",not_declared:"這個頁面沒有開啟 AI 功能。",capability_disabled:"這個畫面不能使用 AI。",capability_removed:"這個 App 版本不支援 AI，請更新。",
  rate_limited:"問太多次了，或用量到上限，等一下再試。",session_expired:"登入過期，請重新登入 Claude。",refused:"這個問題 AI 不回答，換個問法試試。",empty_completion:"AI 沒有回答，換個問法試試。",prompt_too_large:"對話太長了，關掉重開一個。"};
const AI_GONE=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
let chatCtl=null;
function openChat(){const s=L.step,key=txt(s.q||s.title)+"#"+(s.k==="guide"?L.gi:"");let c=CHATS.get(key);
  if(!c){c={turns:[]};CHATS.set(key,c)}c.ctx=ctxOf();
  const quick=s.k==="card"?["這張在講什麼？","可以舉個生活例子嗎？","為什麼要這樣？"]:(L.state==="cont"&&L.lastOk)||(s.k==="guide"&&L.gdone)?["為什麼答案是這個？","可以舉個生活例子嗎？","還有什麼容易搞混的？"]:["為什麼答案是這個？","我的想法哪裡錯了？","可以舉個生活例子嗎？"];
  const el=$("#chat");el.innerHTML=`<div class="sbg" id="cbg"></div><div class="cpanel"><div class="chead"><b>問 AI</b><button class="x" id="cx" aria-label="關閉">${IC.x}</button></div>
    <details class="cctx"><summary>AI 看得到的題目資料</summary><div>${esc(c.ctx)}</div></details>
    <div class="cmsgs" id="cm" aria-live="polite"></div>
    <div class="cquick">${quick.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="cform"><textarea id="ci" rows="1" placeholder="哪裡不懂？直接問" enterkeyhint="send"></textarea><button class="btn" id="cs">送出</button></div>
    <div class="small muted cnote">用的是你自己的 Claude 額度。AI 也可能出錯，跟講義對不上時以講義為準。</div></div>`;
  el.classList.add("on");drawMsgs(c);
  const close=()=>{if(chatCtl)chatCtl.abort();el.classList.remove("on");el.innerHTML=""};
  $("#cx").onclick=close;$("#cbg").onclick=close;
  el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>sendChat(c,b.dataset.q));
  const ci=$("#ci");ci.oninput=()=>{ci.style.height="auto";ci.style.height=Math.min(ci.scrollHeight,120)+"px"};
  ci.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#cs").click()}};
  $("#cs").onclick=()=>{if(chatCtl){chatCtl.abort();return}const v=ci.value.trim();if(!v)return;ci.value="";ci.oninput();sendChat(c,v)}}
function drawMsgs(c,live){const m=$("#cm");if(!m)return;
  m.innerHTML=(c.turns.length?"":`<div class="cmsg a">對這題哪裡不懂？直接問，或點下面的問題。</div>`)+c.turns.map(t=>`<div class="cmsg ${t.role==="user"?"u":"a"}${t.err?" err":""}">${t.role==="user"?esc(t.content):md(t.content)}</div>`).join("")+(live!=null?`<div class="cmsg a" id="clive">${live?md(live):"思考中…"}</div>`:"");
  m.scrollTop=m.scrollHeight}
async function sendChat(c,q){if(!AI||chatCtl)return;c.turns=c.turns.filter(t=>!t.err);c.turns.push({role:"user",content:q});drawMsgs(c,"");
  const cs=$("#cs");if(cs)cs.textContent="停止";chatCtl=new AbortController();
  const input=[{role:"user",content:RULES+c.ctx},...c.turns.slice(-12).map(t=>({role:t.role,content:t.content}))];
  try{const{text,truncated}=await AI(input,{cache:false,signal:chatCtl.signal,modelTier:"default",effort:"low",onText:({text})=>{const b=$("#clive");if(b){b.innerHTML=md(text);$("#cm").scrollTop=$("#cm").scrollHeight}}});
    c.turns.push({role:"assistant",content:text+(truncated?"\n（回答太長被截斷了，可以請它說短一點）":"")})}
  catch(e){const code=e&&e.code;if(e&&e.text&&code!=="refused")c.turns.push({role:"assistant",content:e.text});
    if(code!=="cancelled")c.turns.push({role:"assistant",err:1,content:AI_ERR[code]||"連線中斷了，可以再送一次。"});
    if(AI_GONE.includes(code)){AI=null;document.documentElement.classList.remove("ai")}}
  finally{chatCtl=null;const b=$("#cs");if(b)b.textContent="送出";drawMsgs(c)}}

/* keyboard (desktop) */
document.addEventListener("keydown",e=>{if(!L||L.state==="end"||$("#sheet").classList.contains("on")||$("#chat").classList.contains("on")||e.target.tagName==="TEXTAREA")return;
  if(e.target.tagName==="INPUT")return;
  if(L.step&&L.step.k==="choice"&&L.state==="check"&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(i<L.step.o.length)pickOpt(i)}
  if(e.key==="Enter"&&e.target.tagName!=="BUTTON"){const g=$("#go");if(g&&!g.disabled){e.preventDefault();onGo()}}
});
render();
cloudInit();
</script>
